<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lluvia</title>
  <meta name="theme-color" content="#2A6FB5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3S6 14.5 6 20.5a10 10 0 0 0 20 0C26 14.5 16 3 16 3z' fill='%234A9AD8'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lluvia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Las nubes siguen su camino al cambiar de página, en vez de volver a empezar
    document.documentElement.style.setProperty("--reloj", ((Date.now() / 1000) % 86400).toFixed(1) + "s");
    // Si la página llega con una transición, el sol no vuelve a "amanecer"
    addEventListener("pagereveal", (e) => {
      if (e.viewTransition) document.documentElement.classList.add("llegando");
    });
    try {
      // index.html?olvidar borra todo lo que Lluvia guardó en este navegador
      // (flores vistas, borradores y la bienvenida), para empezar de cero
      if (new URLSearchParams(location.search).has("olvidar")) {
        Object.keys(localStorage)
          .filter((clave) => clave.startsWith("lluvia-"))
          .forEach((clave) => localStorage.removeItem(clave));
      }
      // La primera vez en este dispositivo hay bienvenida (js/intro.js)
      if (!localStorage.getItem("lluvia-intro-vista")) document.documentElement.classList.add("con-intro");
    } catch {}
  </script>
</head>
<body>
  <!-- Cielo del fondo: sol y nubes -->
  <div class="cielo" aria-hidden="true">
    <div class="sol sol--fondo sol--derecha"></div>
    <div class="nube nube--1"></div>
    <div class="nube nube--2"></div>
    <div class="nube nube--3"></div>
  </div>

  <div class="pagina pagina--login">
    <main>
      <header class="marca">
        <svg viewBox="0 0 120 92" aria-hidden="true">
          <g class="marca__nube">
            <circle cx="42" cy="40" r="18"/>
            <circle cx="64" cy="30" r="22"/>
            <circle cx="86" cy="42" r="16"/>
            <rect x="24" y="38" width="78" height="22" rx="11"/>
          </g>
          <path class="marca__gota" d="M44 66s-6 7-6 10.5a6 6 0 0 0 12 0C50 73 44 66 44 66z"/>
          <path class="marca__gota" d="M63 70s-6 7-6 10.5a6 6 0 0 0 12 0C69 77 63 70 63 70z"/>
          <path class="marca__gota" d="M82 66s-6 7-6 10.5a6 6 0 0 0 12 0C88 73 82 66 82 66z"/>
        </svg>
        <h1>Lluvia</h1>
        <p class="lema">Una pregunta al día, para conocernos un poquito más.</p>
      </header>

      <form id="login-form" class="nube-pregunta">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" autocapitalize="none" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn--ancho">Entrar</button>

        <p id="mensaje" role="status"></p>
      </form>
    </main>

    <footer class="prado prado--bajo" aria-hidden="true">
      <svg class="prado__montanas" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="montana--lejos" d="M0 120V78C70 60 120 30 190 34s120 40 190 30 110-52 200-50 130 44 210 40 120-46 210-44 140 38 220 36 130-30 220-20V120Z"/>
        <path class="montana--cerca" d="M0 120V96C90 80 150 54 240 60s140 34 230 28 120-38 220-34 150 34 240 32 140-30 230-24 120 20 280 26V120Z"/>
      </svg>
      <svg class="prado__colinas" viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path class="colina--atras" d="M0 60C240 0 480 10 720 50s480 -30 720 -10V120H0Z"/>
        <path class="colina--frente" d="M0 100C300 50 560 70 820 95s440 -25 620 -15V120H0Z"/>
      </svg>
      <div class="prado__suelo"></div>
    </footer>
  </div>

  <!-- Bienvenida, solo la primera vez (js/intro.js) -->
  <div id="intro" class="intro" hidden>
    <p class="intro__frase intro__frase--1">Una pregunta al día</p>
    <p class="intro__frase intro__frase--2">para conocernos mejor</p>
    <p class="intro__frase intro__frase--3">y una flor por cada día que respondemos los dos</p>
    <button type="button" id="btn-saltar" class="btn-saltar">Saltar</button>
  </div>

  <!-- Librería de Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/login.js"></script>
  <script src="js/flores.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
