<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lluvia</title>
  <meta name="theme-color" content="#21948A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3S6 14.5 6 20.5a10 10 0 0 0 20 0C26 14.5 16 3 16 3z' fill='%2321948A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
  <!-- Gotas decorativas del fondo -->
  <div class="lluvia" aria-hidden="true">
    <span class="gota"></span><span class="gota"></span><span class="gota"></span><span class="gota"></span>
    <span class="gota"></span><span class="gota"></span><span class="gota"></span>
  </div>

  <main>
    <header class="marca">
      <svg viewBox="0 0 120 92" aria-hidden="true">
        <g class="nube">
          <circle cx="42" cy="40" r="18"/>
          <circle cx="64" cy="30" r="22"/>
          <circle cx="86" cy="42" r="16"/>
          <rect x="24" y="38" width="78" height="22" rx="11"/>
        </g>
        <path class="gotita" d="M44 66s-6 7-6 10.5a6 6 0 0 0 12 0C50 73 44 66 44 66z"/>
        <path class="gotita" d="M63 70s-6 7-6 10.5a6 6 0 0 0 12 0C69 77 63 70 63 70z"/>
        <path class="gotita" d="M82 66s-6 7-6 10.5a6 6 0 0 0 12 0C88 73 82 66 82 66z"/>
      </svg>
      <h1>Lluvia</h1>
      <p class="lema">Una pregunta al día, para conocernos un poquito más.</p>
    </header>

    <form id="login-form" class="tarjeta">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" autocapitalize="none" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn--ancho">Entrar</button>

      <p id="mensaje" role="status"></p>
    </form>
  </main>

  <!-- Librería de Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
