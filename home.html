<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lluvia - Inicio</title>
  <meta name="theme-color" content="#21948A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3S6 14.5 6 20.5a10 10 0 0 0 20 0C26 14.5 16 3 16 3z' fill='%2321948A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Gotas decorativas del fondo -->
  <div class="lluvia" aria-hidden="true">
    <span class="gota"></span><span class="gota"></span><span class="gota"></span><span class="gota"></span>
    <span class="gota"></span><span class="gota"></span><span class="gota"></span>
  </div>

  <!-- Oculto hasta confirmar que hay sesión iniciada -->
  <main id="contenido" hidden>
    <header class="cabecera">
      <h1 id="saludo"></h1>
      <p id="contador-dias" class="contador"></p>
    </header>

    <nav class="nav" aria-label="Secciones">
      <a href="home.html" aria-current="page">Hoy</a>
      <a href="historial.html">Historial</a>
    </nav>

    <section class="tarjeta">
      <p id="titulo-pregunta" class="etiqueta">Pregunta del día</p>
      <h2 id="texto-pregunta" class="pregunta"></h2>

      <form id="form-respuesta" hidden>
        <label for="respuesta">Tu respuesta</label>
        <textarea id="respuesta" rows="6" required></textarea>
        <button type="submit" id="btn-guardar" class="btn">Guardar respuesta</button>
      </form>

      <p id="estado" class="estado" role="status"></p>
    </section>

    <section id="seccion-pareja" class="tarjeta pareja" hidden>
      <h2 id="titulo-pareja"></h2>
      <p id="respuesta-pareja" class="texto-respuesta"></p>
    </section>

    <button id="btn-salir" class="btn-texto">Cerrar sesión</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/lluvia.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
